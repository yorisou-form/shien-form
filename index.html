<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>支援記録 入力（試作）</title>
<style>
  :root { --main:#2f7d6d; --main-d:#235f53; --bg:#f4f6f5; --line:#d5dbd8; --err:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:#222; font-size:17px; }
  header { background:var(--main); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  header button { background:transparent; color:#fff; border:1px solid #fff9; border-radius:8px; padding:6px 10px; font-size:14px; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px #0001; }
  label.t { display:block; font-weight:600; margin:18px 0 8px; }
  label.t:first-child { margin-top:0; }
  .req { color:var(--err); font-size:13px; margin-left:4px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=search], textarea, select {
    width:100%; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; min-height:50px; }
  textarea { min-height:160px; line-height:1.6; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:10px 14px; font-size:15px; min-height:44px; }
  .chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  .checks label { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; min-height:50px; }
  .checks input { width:24px; height:24px; }
  .btn { width:100%; background:var(--main); color:#fff; border:0; border-radius:12px; padding:16px; font-size:18px; font-weight:700; min-height:56px; }
  .btn:active { background:var(--main-d); }
  .btn:disabled { opacity:.5; }
  .muted { color:#666; font-size:14px; }
  .msg { padding:12px 14px; border-radius:10px; margin-bottom:12px; display:none; }
  .msg.ok { background:#e3f4ee; color:#1d5e4f; display:block; }
  .msg.ng { background:#fdecea; color:var(--err); display:block; }
  .picker-list { border:1px solid var(--line); border-radius:10px; max-height:300px; overflow:auto; margin-top:8px; display:none; }
  .picker-list button { display:block; width:100%; text-align:left; background:#fff; border:0; border-bottom:1px solid #eee; padding:12px; font-size:16px; min-height:52px; }
  .picker-list button small { color:#666; margin-left:8px; }
  .picked { display:none; align-items:center; justify-content:space-between; background:#e9f3f0; border-radius:10px; padding:12px; margin-top:8px; }
  .picked button { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; }
  .toggle { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:15px; }
  .toggle input { width:22px; height:22px; }
  .recent-item { border-bottom:1px solid #eee; padding:10px 0; }
  .recent-item:last-child { border-bottom:0; }
  .recent-item .h { font-weight:600; }
  .recent-item .b { font-size:14px; color:#444; white-space:pre-wrap; margin-top:4px; }
  .hidden { display:none !important; }
  .jikan { font-size:15px; color:#444; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>支援記録 入力 <span style="font-size:12px;opacity:.8">試作</span></h1>
  <button id="logoutBtn" class="hidden">ログアウト</button>
</header>
<main>
  <!-- ログイン -->
  <section id="loginView" class="card hidden">
    <div id="loginMsg" class="msg"></div>
    <label class="t" for="email">ID</label>
    <input id="email" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：kanno">
    <label class="t" for="password">パスワード</label>
    <input id="password" type="password" autocomplete="current-password">
    <div style="height:18px"></div>
    <button id="loginBtn" class="btn">ログイン</button>
    <p class="muted">アカウントは管理者が発行します。</p>
  </section>

  <!-- 権限なし -->
  <section id="noAccessView" class="card hidden">
    <p>このアカウントには入力の権限がありません。管理者に職員登録を依頼してください。</p>
  </section>

  <!-- 入力フォーム -->
  <section id="formView" class="hidden">
    <div class="card">
      <div id="formMsg" class="msg"></div>

      <label class="t" for="hiduke">日付<span class="req">必須</span></label>
      <input id="hiduke" type="date">

      <div class="row">
        <div><label class="t" for="kaishi">開始時刻</label><input id="kaishi" type="time" step="300"></div>
        <div><label class="t" for="shuryo">終了時刻</label><input id="shuryo" type="time" step="300"></div>
      </div>
      <div id="jikanView" class="jikan"></div>

      <label class="t" for="rSearch">利用者<span class="req">必須</span></label>
      <input id="rSearch" type="search" placeholder="名前 または フリガナで検索" autocomplete="off">
      <div class="toggle" style="display:none !important"><input id="showAll" type="checkbox" checked><label for="showAll">契約中以外の人も表示する</label></div>
      <div id="rList" class="picker-list"></div>
      <div id="rPicked" class="picked"><div><b id="rPickedName"></b> <small id="rPickedKana" class="muted"></small></div><button id="rClear" type="button">変更</button></div>

      <label class="t" for="naiyou">支援内容</label>
      <div id="naiyouChips" class="chips"></div>
      <input id="naiyou" type="text" placeholder="選ぶか、自由に入力">

      <div style="display:none"><div id="tantoChips" class="chips"></div><input id="tanto" type="text"></div>

      <label class="t">対応区分</label>
      <div id="kubunChecks" class="checks"></div>

      <label class="t" for="kiroku">支援記録</label>
      <textarea id="kiroku" placeholder="支援の内容や様子を記入"></textarea>

      <div style="height:18px"></div>
      <button id="saveBtn" class="btn">保存する</button>
    </div>

    <div class="card">
      <b>自分が入力した最近の記録</b>
      <div id="recent" class="muted" style="margin-top:8px">読み込み中…</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yajpvwtrxlrdmwkpsodh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MJlZVl-baLFgywtWGaf6WQ_PSQRrJjb'; // 公開用キー（RLSで保護）
// localStorageが使えない環境（プレビュー等）でも動くように
const memStore = {};
const safeStore = {
  getItem(k) { try { return window.localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; } },
  setItem(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } },
  removeItem(k) { try { window.localStorage.removeItem(k); } catch (e) { delete memStore[k]; } },
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: safeStore } });

const $ = id => document.getElementById(id);
let riyousha = [], picked = null, staffName = '';

function show(view) {
  ['loginView','noAccessView','formView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
  $('logoutBtn').classList.toggle('hidden', view === 'loginView');
}
function msg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'ng'); }
function clearMsg(el) { el.className = 'msg'; el.textContent = ''; }
function todayTokyo() {
  return new Intl.DateTimeFormat('sv-SE', { timeZone:'Asia/Tokyo' }).format(new Date());
}
function norm(s) { // ひらがな→カタカナ、空白除去
  return (s || '').replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[\s\u3000]/g, '').toLowerCase();
}
function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- 認証 ----
$('loginBtn').onclick = async () => {
  clearMsg($('loginMsg'));
  $('loginBtn').disabled = true;
  const id = $('email').value.trim().toLowerCase();
  const email = id.includes('@') ? id : id + '@id.yorisou.local';
  const { error } = await sb.auth.signInWithPassword({ email, password: $('password').value });
  $('loginBtn').disabled = false;
  if (error) msg($('loginMsg'), 'ログインできませんでした。IDとパスワードを確認してください。', false);
};
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); };

sb.auth.onAuthStateChange((event, session) => {
  setTimeout(() => { if (session) start(session); else { started = false; show('loginView'); } }, 0);
});

let started = false;
async function start(session) {
  if (started) return; started = true;
  const opts = await sb.rpc('form_options');
  if (opts.error || !opts.data) { started = false; show('noAccessView'); return; }
  const st = await sb.from('staff').select('display_name').maybeSingle();
  staffName = st.data?.display_name || '';
  $('logoutBtn').textContent = (staffName ? staffName + 'さん　' : '') + 'ログアウト';
  try {
    buildOptions(opts.data);
    await loadRiyousha();
    resetForm();
  } catch (e) { console.error(e); msg($('formMsg'), '画面の準備中にエラー: ' + e.message, false); }
  show('formView');
  loadRecent();
}

// ---- 選択肢 ----
function chipGroup(container, values, input) {
  container.innerHTML = '';
  values.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = v;
    b.onclick = () => { input.value = v; input.dispatchEvent(new Event('input')); };
    container.appendChild(b);
  });
  input.addEventListener('input', () => {
    [...container.children].forEach(c => c.classList.toggle('on', c.textContent === input.value));
  });
}
function buildOptions(o) {
  chipGroup($('naiyouChips'), o.naiyou || [], $('naiyou'));
  chipGroup($('tantoChips'), o.tanto || [], $('tanto'));
  $('kubunChecks').innerHTML = (o.kubun || []).map(k =>
    `<label><input type="checkbox" value="${esc(k)}"> ${esc(k)}</label>`).join('');
}

// ---- 利用者ピッカー ----
async function loadRiyousha() {
  const all = []; let from = 0;
  while (true) {
    const { data, error } = await sb.from('riyousha').select('kintone_record_id,riyousha_mei,furigana,jotai')
      .order('furigana', { nullsFirst:false }).range(from, from + 999);
    if (error) { msg($('formMsg'), '利用者一覧を読み込めませんでした: ' + error.message, false); return; }
    all.push(...data); if (data.length < 1000) break; from += 1000;
  }
  riyousha = all.filter(r => r.riyousha_mei).map(r => ({ ...r, key: norm(r.riyousha_mei) + ' ' + norm(r.furigana) }));
}
function renderList() {
  const q = norm($('rSearch').value);
  const all = $('showAll').checked;
  if (!q) { $('rList').style.display = 'none'; return; }
  const hits = riyousha.filter(r => (all || r.jotai === '契約') && r.key.includes(q)).slice(0, 40);
  const counts = {}; riyousha.forEach(r => counts[r.riyousha_mei] = (counts[r.riyousha_mei] || 0) + 1);
  $('rList').innerHTML = hits.length ? hits.map(r =>
    `<button type="button" data-id="${r.kintone_record_id}">${esc(r.riyousha_mei)}<small>${esc(r.furigana || '')}${counts[r.riyousha_mei] > 1 ? '・No.' + r.kintone_record_id : ''}</small></button>`).join('')
    : `<div class="muted" style="padding:12px">見つかりません</div>`;
  $('rList').style.display = 'block';
}
$('rSearch').addEventListener('input', renderList);
$('showAll').addEventListener('change', renderList);
$('rList').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  picked = riyousha.find(r => String(r.kintone_record_id) === b.dataset.id);
  $('rPickedName').textContent = picked.riyousha_mei;
  $('rPickedKana').textContent = (picked.furigana || '') + '（No.' + picked.kintone_record_id + '）';
  $('rPicked').style.display = 'flex';
  $('rSearch').classList.add('hidden'); $('rList').style.display = 'none';
  $('showAll').parentElement.classList.add('hidden');
});
$('rClear').onclick = () => {
  picked = null; $('rPicked').style.display = 'none';
  $('rSearch').classList.remove('hidden'); $('showAll').parentElement.classList.remove('hidden');
  $('rSearch').value = ''; $('rSearch').focus();
};

// ---- 時間（既存データと同じく「時間・切り上げ」） ----
function calcJikan() {
  const a = $('kaishi').value, b = $('shuryo').value;
  if (!a || !b) { $('jikanView').textContent = ''; return null; }
  const m = (+b.slice(0,2) * 60 + +b.slice(3,5)) - (+a.slice(0,2) * 60 + +a.slice(3,5));
  if (m < 0) { $('jikanView').textContent = '⚠ 終了時刻が開始時刻より前です'; return -1; }
  const h = Math.ceil(m / 60);
  $('jikanView').textContent = `${Math.floor(m/60)}時間${m%60}分 → 記録上の時間: ${h}時間（切り上げ）`;
  return h;
}
$('kaishi').addEventListener('input', calcJikan);
$('shuryo').addEventListener('input', calcJikan);

// ---- 保存 ----
function resetForm() {
  $('hiduke').value = todayTokyo();
  $('kaishi').value = ''; $('shuryo').value = ''; calcJikan();
  $('rClear').onclick(); $('rSearch').blur();
  $('naiyou').value = ''; $('naiyou').dispatchEvent(new Event('input'));
  $('tanto').value = staffName || '';
  $('tanto').dispatchEvent(new Event('input'));
  document.querySelectorAll('#kubunChecks input').forEach(c => c.checked = false);
  $('kiroku').value = '';
}
$('saveBtn').onclick = async () => {
  clearMsg($('formMsg'));
  if (!$('hiduke').value) return msg($('formMsg'), '日付を入れてください。', false);
  if (!picked) return msg($('formMsg'), '利用者を選んでください。', false);
  if (calcJikan() === -1) return msg($('formMsg'), '終了時刻が開始時刻より前になっています。', false);
  const row = {
    riyousha_id: picked.kintone_record_id,
    riyousha_mei: picked.riyousha_mei,
    hiduke: $('hiduke').value,
    kaishi_jikoku: $('kaishi').value || null,
    shuryo_jikoku: $('shuryo').value || null,
    shien_naiyou: $('naiyou').value.trim() || null,
    tanto: $('tanto').value.trim() || null,
    taiou_kubun: [...document.querySelectorAll('#kubunChecks input:checked')].map(c => c.value),
    kiroku: $('kiroku').value.trim() || null,
  };
  $('saveBtn').disabled = true;
  const { data, error } = await sb.from('shien_kiroku').insert(row).select('kintone_record_id').single();
  $('saveBtn').disabled = false;
  if (error) return msg($('formMsg'), '保存できませんでした: ' + error.message, false);
  const who = row.riyousha_mei;
  resetForm();
  msg($('formMsg'), `保存しました（${who}さん、記録No.${data.kintone_record_id}）`, true);
  window.scrollTo({ top:0, behavior:'smooth' });
  loadRecent();
};

// ---- 最近の記録 ----
async function loadRecent() {
  const { data, error } = await sb.from('shien_kiroku')
    .select('kintone_record_id,hiduke,kaishi_jikoku,shuryo_jikoku,jikan,riyousha_mei,shien_naiyou,tanto,taiou_kubun,kiroku')
    .order('created_at', { ascending:false }).limit(10);
  if (error) { $('recent').textContent = '読み込めませんでした: ' + error.message; return; }
  if (!data.length) { $('recent').textContent = 'まだありません。'; return; }
  $('recent').classList.remove('muted');
  $('recent').innerHTML = data.map(r => `<div class="recent-item">
    <div class="h">${esc(r.hiduke)} ${r.kaishi_jikoku ? esc(r.kaishi_jikoku.slice(0,5)) + '〜' + esc((r.shuryo_jikoku||'').slice(0,5)) : ''} ${esc(r.riyousha_mei)}</div>
    <div class="muted">${esc(r.shien_naiyou || '')}${r.tanto ? '／' + esc(r.tanto) : ''}${r.jikan != null ? '／' + r.jikan + '時間' : ''}${(r.taiou_kubun||[]).length ? '／' + esc(r.taiou_kubun.join('・')) : ''}</div>
    ${r.kiroku ? `<div class="b">${esc(r.kiroku.length > 120 ? r.kiroku.slice(0,120) + '…' : r.kiroku)}</div>` : ''}
  </div>`).join('');
}
</script>
</body>
</html>
